<!-- ws_client.html -->
<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Notifications</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f5f5f5; }
        #stats { background: #d4edda; padding: 10px; margin-bottom: 10px; border-radius: 6px; }
        #status { font-weight: bold; margin-bottom: 10px; }
        .notif { background: white; padding: 10px; margin: 6px 0;
                 border-left: 4px solid #007bff; border-radius: 4px; }
        .order   { border-color: #28a745; }
        .alert   { border-color: #dc3545; }
        .message { border-color: #007bff; }
    </style>
</head>
<body>
<h2>WebSocket Push Dashboard</h2>
<div id="status">Connecting...</div>
<div id="stats">Messages received: 0 | Zero wasted requests</div>
<div id="feed"></div>

<script>
    let totalNotifs = 0;

    function connect() {
      const ws = new WebSocket('ws://localhost:8001/ws');

      ws.onopen = () => {
        document.getElementById('status').textContent = '🟢 Connected';
      };

      ws.onmessage = (event) => {
        const notif = JSON.parse(event.data);
        totalNotifs++;
        addNotification(notif);
        document.getElementById('stats').textContent =
          `Messages received: ${totalNotifs} | Zero wasted requests`;
      };

      ws.onclose = () => {
        document.getElementById('status').textContent = '🔴 Disconnected. Reconnecting...';
        setTimeout(connect, 2000);  // auto reconnect
      };
    }

    function addNotification(n) {
      const div = document.createElement('div');
      div.className = `notif ${n.type}`;
      div.textContent = `[${n.type.toUpperCase()}] ${n.text}`;
      document.getElementById('feed').prepend(div);
    }

    connect();
</script>
</body>
</html>
